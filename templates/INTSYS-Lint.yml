exam: INTELLIGENT SYSTEMS M

date: xx/xx/2024

exercises:
  # training set exercise
  #  - output: the name of the output column
  #  - **kwargs: the name of the input columns, paired with the possible values that can be taken
  training:
    output: Test
    Framework: [ V2, V1 ]
    Plane: [ Airbus, Boeing, Comac ]

  # blank space for the exercise
  blank: null

  # planning exercise
  #  - init: list of propositions ([name, param_1, ..., param_N]) representing the initial state
  #  - goal: list of propositions ([name, param_1, ..., param_N]) representing the goal state
  #  - **kwargs: actions defined as a dictionary with keys:
  #       * variables -> dictionary of variables mapped with possible values they can take
  #       * precond -> list of propositions necessary for the precondition
  #       * delete -> list of propositions in the delete list
  #       * add -> list of propositions in the add list
  #  - [graph_width]: the width of the graphplan solution image [default: 21]
  planning:
    init:
      - [ has_slides, ml ]
      - [ is_awake ]
    
    goal:
      - [ has_knowledge, ml ]
      - [ has_knowledge, cv ]
    
    study:
      variables:
        Subject: [ ml, cv ]
      precond:
        - [ is_awake ]
        - [ has_slides, Subject ]
      delete:
        - [ is_awake ]
      add:
        - [ is_sleeping ]
        - [ has_knowledge, Subject ]
    
    swap_slides:
      variables:
        Subject1: [ ml, cv ]
        Subject2: [ ml, cv ]
      precond:
        - [ has_slides, Subject1 ]
      delete:
        - [ has_slides, Subject1 ]
      add:
        - [ has_slides, Subject2 ]
    
    drink_coffe:
      variables:
      precond:
        - [ is_sleeping ]
      delete:
        - [ is_sleeping ]
      add:
        - [ is_awake ]
    
    graph_width: 21

  # open questions
  #  - exam: the exam type, used to select the pool of questions, either "faikr" or "intsys"
  #  - [kowalski]: name of the action to be modeled [default: random choice]
  questions:
    exam: intsys
    kowalski: null
    