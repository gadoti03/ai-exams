exam: FUNDAMENTALS OF AI - FIRST MODULE

date: xx/xx/2024

exercises:
  # game tree exercise:
  #  - [values]: list of 16 integer values corresponding to the leaves [default: random choice]
  game:
    values: [ -95, -72, -75, -9, 7, -89, -63, -26, -32, 22, 20, 53, 42, 19, -15, 34 ]

  # search strategy exercise:
  #  - [source]: ID of the source node [default: 'A']
  #  - [destination]: ID of the destination node [default: random choice]
  #  - [nodes]: dictionary of node IDs mapped to their heuristic value [default: random initialization]
  #  - [arcs]: list of triplets >sourceID, destinationID, weight> [default: random initialization]
  #  - [graph_ratio]: the ratio of the input graph figure [default: 1]
  #  - [level_ratio]: the (per-level) ratio of the output solution figure [default: 7]
  #  - [label_offset]: the label offset of the output solution figure [default: 0.13]
  #  - [heuristic_offset]: the heuristic offset of the output solution figure [default: 0.1]
  search:
    source: A
    destination: E
    nodes:
      A: 9
      B: 4
      C: 4
      D: 4
      E: 0
      F: 2
      G: 2
    arcs:
      - [ A, C, 8.0 ]
      - [ A, G, 13.0 ]
      - [ A, B, 9.0 ]
      - [ A, F, 3.0 ]
      - [ B, E, 5.0 ]
      - [ C, E, 4.0 ]
      - [ D, C, 6.0 ]
      - [ D, F, 8.0 ]
      - [ F, E, 6.0 ]
      - [ G, C, 7.0 ]
    graph_ratio: 1
    level_ratio: 7
    label_offset: 0.13
    heuristic_offset: 0.1

  # csp exercise:
  #  - variables: dictionary of variable IDs mapped to their domain
  #  - constraints: *binary* constraints between variables (only basic operators like +, -, *, and / are supported)
  #  - [kind]: exercise type, either 'consistency', 'forward', or 'lookahead' [default: random choice]
  #  - [assign]: value assignment for the first variable in 'lookahead' [default: random choice]
  csp:
    variables:
      A: [ 1, 2, 3, 4, 5 ]
      B: [ 1, 2, 3, 4, 5 ]
      C: [ 1, 2, 3, 4, 5 ]
      D: [ 1, 2, 3, 4, 5 ]
    constraints:
      - A > B
      - C > B + 1
      - A = D - 1
      - B = D - 3
    kind: lookahead
    assign: 3

  # planning exercise
  #  - init: list of propositions ([name, param_1, ..., param_N]) representing the initial state
  #  - goal: list of propositions ([name, param_1, ..., param_N]) representing the goal state
  #  - **kwargs: actions defined as a dictionary with keys:
  #       * variables -> dictionary of variables mapped with possible values they can take
  #       * precond -> list of propositions necessary for the precondition
  #       * delete -> list of propositions in the delete list
  #       * add -> list of propositions in the add list
  #  - [graph_ratio]: the width of the graphplan solution image [default: 3]
  planning:
    init:
      - [ has_slides, ml ]
      - [ is_awake ]
    
    goal:
      - [ has_knowledge, ml ]
      - [ has_knowledge, cv ]
    
    study:
      variables:
        Subject: [ ml, cv ]
      precond:
        - [ is_awake ]
        - [ has_slides, Subject ]
      delete:
        - [ is_awake ]
      add:
        - [ is_sleeping ]
        - [ has_knowledge, Subject ]
    
    swap_slides:
      variables:
        Subject1: [ ml, cv ]
        Subject2: [ ml, cv ]
      precond:
        - [ has_slides, Subject1 ]
      delete:
        - [ has_slides, Subject1 ]
      add:
        - [ has_slides, Subject2 ]
    
    drink_coffe:
      variables:
      precond:
        - [ is_sleeping ]
      delete:
        - [ is_sleeping ]
      add:
        - [ is_awake ]
    
    graph_ratio: 3

  # open questions
  #  - exam: the exam type, used to select the pool of questions, either "faikr" or "intsys"
  #  - [kowalski]: name of the action to be modeled [default: random choice]
  questions:
    exam: faikr
    kowalski: drink_coffe
    